<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trello Authorization Callback</title>
  </head>
  <body>
    <script>
      (function () {
        // Trello fragment authorization returns token in window.location.hash: #token=...
        const hashMatch = window.location.hash.match(/token=([^&]+)/);
        const searchParams = new URLSearchParams(window.location.search);
        const token = (hashMatch && hashMatch[1]) || searchParams.get('token');

        if (token) {
          try {
            localStorage.setItem('trello_token', token);
          } catch (e) {}

          if (window.opener) {
            // Trello Power-Up client expects the token string directly
            window.opener.postMessage(token, window.location.origin);
          }
        }
        setTimeout(function () {
          window.close();
        }, 300);
      })();
    </script>
  </body>
</html>
